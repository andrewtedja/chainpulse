services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    restart: always
  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always
